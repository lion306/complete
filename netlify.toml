[build]
  base    = "frontend"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"
  # Disable treating warnings as errors (CRA default)
  CI = "false"

# Proxy: alle /api/* Anfragen werden an Railway weitergeleitet
[[redirects]]
  from   = "/api/*"
  to     = "{{ RAILWAY_URL }}/api/:splat"
  status = 200
  force  = true

# SPA fallback: all routes serve index.html (required for React Router)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
