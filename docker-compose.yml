version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms_backend
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  uploads_data:
  logs_data:
