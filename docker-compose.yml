version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms_backend
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    restart: unless-stopped
    networks:
      - dms_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dms_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - dms_network

networks:
  dms_network:
    driver: bridge

volumes:
  uploads_data:
  logs_data:
