version: '3.9'

# Datenbank: Supabase (extern, kein lokaler db-Container nötig)
# Projekt-Ref: qetufwdvtejydjycgdbo
# Dashboard: https://supabase.com/dashboard/project/qetufwdvtejydjycgdbo

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms_backend
    environment:
      NODE_ENV: production
      PORT: 3001
      # Supabase PostgreSQL
      DB_HOST: ${DB_HOST:-db.qetufwdvtejydjycgdbo.supabase.co}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "true"
      # Supabase API
      SUPABASE_URL: ${SUPABASE_URL:-https://qetufwdvtejydjycgdbo.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # App
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production_jwt_secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dms_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  uploads_data:
  logs_data:
